<div style="background-color: white;" class="md:px-5 md:py-6 md:text-xl text-xs w-full md:inline flex gap-3 p-2 align-content-top" [ngClass]="align ? 'align-content-center' : 'align-content-top'">
    <div [style.background-image]="'url(&quot;' + urlImg + '&quot;)'" style=" color: #480A91; background-size: cover; background-position: top; background-repeat: no-repeat;" class="border-circle md:w-5rem w-2rem md:h-5rem h-2rem m-2 font-bold flex align-items-center justify-content-center"></div>
    <div class="flex align-content-center flex-wrap w-full">
        <div>
            <div class="font-bold">{{name}}</div>
            <div class="opacity-50">{{occupation}}</div>
            <div class="md:flex flex-wrap hidden gap-1 py-2">
                @for (item of label; track label) {
                    <div class="px-1 opacity-20 text-sm" style="border: 1px solid #000;">{{item}}</div>
                }
            </div>
            <div class="md:inline sm:text-base hidden w-full">{{description}}</div>
        </div>
    </div>
</div>
